{% load static %}

{% block body %}

{% include 'navigation.html' %}

<marquee style="font-family: 'Monotype Corsiva' ; font-size: 25px ; color: darksalmon ; background-color: chocolate ; font-weight: bold ; margin-top: 1%;">
    User Login
</marquee>

<form class="container mt-5" method = "Post" > 
    {% csrf_token %}
    <label><b>Email ID</b></label>
    <input type="email" class="form-control" name="uname" placeholder="Enter Your Email ID">

    <label><b>Password</b></label>
    <input type="password" class="form-control" name="pwd" placeholder="Enter Your Password">
    <input type="submit" value="Login" class="btn btn-primary" style="margin-top:2% ; color: coral ; background-color: darkslategrey; height: 40px ; ">
<a href="{% url 'user_signup' %}" class="btn btn-pripxstyle" style="margin-top:2% ; color: coral ; background-color: darkslategrey; height: 40px ">Create an account</a>    
</form>
{% include 'footer.html' %}

{% if error == "no" %}
<script>
    alert("Login Successful");
    window.location = '{% url "user_home" %}'
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Invalid Login Credentials, Please Try Again");
</script>
{% endif %}


{% endblock %}
