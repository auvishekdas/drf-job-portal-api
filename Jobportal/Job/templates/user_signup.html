{% load static %}

{% block body %}

{% include 'navigation.html' %}

<marquee style="font-family: 'Monotype Corsiva' ; font-size: 25px ; color: darksalmon ; background-color: chocolate ; font-weight: bold ; margin-top: 1%;">
    User Signup
</marquee>

<form class="container mt-5" method="Post" enctype="multipart/form-data"> 
    {% csrf_token %}
    
    <div class="form-row">
        <div class="form-group col-md-6">
            <label>First Name</label>
            <input type="text" class="form-control" name="fname" placeholder="Enter your First Name">
        </div>

        <div class="form-group col-md-6">
            <label>Last Name</label>
            <input type="text" class="form-control" name="lname" placeholder="Enter your Last Name">    
        </div>

        <div class="form-group col-md-12">
            <label>Contact Number</label>
            <input type="text" class="form-control" name="Contact" placeholder="Enter your Contact Number">    
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12">
            <label>Email Address</label>
            <input type="text" class="form-control" name="Email" placeholder="Enter your Email Address">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label>Password</label>
            <input type="text" class="form-control" name="pwd" placeholder="Enter your Password">
        </div>

        <div class="form-group col-md-6">
            <label>Confirm Password</label>
            <input type="text" class="form-control" name="cpwd" placeholder="Enter your Password again">    
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label>Gender</label>
            <div style="border: 1px solid seagreen; padding: 6px; border-radius: 6px;">
                <div class="custom-control custom-radio custom-control-inline">
                    <input type="radio" id="customRadioInline1" name="gender" class="custom-control-input" value="Male">
                    <label class="custom-control-label" for="customRadioInline1">Male</label>
                </div>
                
                <div class="custom-control custom-radio custom-control-inline ml-3">
                    <input type="radio" id="customRadioInline2" name="gender" class="custom-control-input" value="Female">
                    <label class="custom-control-label" for="customRadioInline2">Female</label>
                </div>
            </div>
        </div>

        <div class="form-group col-md-6">
            <label>Image</label>
            <input type="file" class="form-control" name="img"> 
        </div>
    </div>

    <input type="submit" value="Submit" class="btn btn-primary my-2" style="width: 200px">

</form>

{% include 'footer.html' %}

{% endblock %}
