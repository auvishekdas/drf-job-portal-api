{% load static %}

{% block body %}

{% include 'user_navigation.html' %}

<script>
    function checkpass()
    {
    if(document.changepassword.newpassword.value!=document.changepassword.confirmpassword.value)
    {
    alert('New Password and Confirm Password are not same');
    document.changepassword.confirmpassword.focus();
    return false;
    }
    return true;
    }
</script>

<!-- DataTables CSS and Buttons CSS CDN Links -->
<link rel="stylesheet" href="https://cdn.datatables.net/3.1.5/css/dataTables.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/4.1.3/css/buttons.dataTables.min.css">

<marquee style="font-family: 'Monotype Corsiva' ; font-size: 25px ; color: darksalmon ; background-color: chocolate ; font-weight: bold ; margin-top: 1%;">
    Change Password
</marquee>

<form class="container mt-5" method = "Post" name="changepassword" onsubmit="return checkpass()"> 
    {% csrf_token %}

    <label><b>Current Password</b></label>
    <input type="password" class="form-control" name="currentpassword" required="true">

    <label><b>New Password</b></label>
    <input type="password" class="form-control" name="newpassword" required="true">

    <label><b>Confirm New Password</b></label>
    <input type="password" class="form-control" name="confirmpassword" required="true">
    

    <input type="submit" class="btn btn-primary" style="margin-top:2% ; color: coral ; background-color: darkslategrey; height: 40px ; ">
</form>

{% if error == "no" %}
<script>
    alert("Password Changes");
    window.location = '{% url "Logout" %}'
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something went wrong");
</script>
{% endif %}

{% if error == "not" %}
<script>
    alert("Current password is wrong");
</script>
{% endif %}

{% endblock %}
