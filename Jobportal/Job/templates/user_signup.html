{% load static %}

{% block body %}

{% include 'navigation.html' %}

<marquee style="font-family: 'Monotype Corsiva' ; font-size: 25px ; color: darksalmon ; background-color: chocolate ; font-weight: bold ; margin-top: 1%;">
    User Signup
</marquee>

<form class="container mt-5" method = "Post" enctype="multipart/form-data"> 
    {% csrf_token %}
    
    <div class="form-row">
        <div class="form-group col-md-6">
            <label>First Name</label>
            <input type="text" class="form-control" name="fname" placeholder="Enter your first name">
        </div>

        <div class="form-group col-md-6">
            <label>Last Name</label>
            <input type="text" class="form-control" name="lname" placeholder="Enter your last name">    
        </div>
        
    </div>
</form>
{% include 'footer.html' %}
{% endblock %}
