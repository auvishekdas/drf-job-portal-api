{% load static %}

{% block body %}

{% include 'navigation.html' %}

<script>
    function checkpass()
    {
    if(document.signup.pwd.value!=document.signup.cpwd.value)
    {
    alert('Password and Confirm Password field does not match');
    document.signup.cpwd.focus();
    return false;
    }
    return true;
    }
</script>

<marquee style="font-family: 'Monotype Corsiva' ; font-size: 25px ; color: darksalmon ; background-color: chocolate ; font-weight: bold ; margin-top: 1%;">
    User Signup
</marquee>

<form class="container mt-5" onsubmit="return checkpass();" name="signup" method="Post" enctype="multipart/form-data"> 
    {% csrf_token %}
    
    <div class="form-row">
        <div class="form-group col-md-6">
            <label>First Name</label>
            <input type="text" class="form-control" name="fname" placeholder="Enter your First Name" required>
        </div>

        <div class="form-group col-md-6">
            <label>Last Name</label>
            <input type="text" class="form-control" name="lname" placeholder="Enter your Last Name" required>    
        </div>

        <div class="form-group col-md-12">
            <label>Contact Number</label>
            <input type="text" class="form-control" name="Contact" placeholder="Enter your Contact Number" required>    
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-12">
            <label>Email Address</label>
            <input type="email" class="form-control" name="email" placeholder="Enter your Email Address" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label>Password</label>
            <input type="password" class="form-control" name="pwd" placeholder="Enter your Password" required>
        </div>

        <div class="form-group col-md-6">
            <label>Confirm Password</label>
            <input type="password" class="form-control" name="cpwd" placeholder="Enter your Password again" required>    
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-md-6">
            <label>Gender</label>
            <div style="border: 1px solid seagreen; padding: 6px; border-radius: 6px;">
                <div class="custom-control custom-radio custom-control-inline">
                    <input type="radio" id="customRadioInline1" name="gender" class="custom-control-input" value="Male">
                    <label class="custom-control-label" for="customRadioInline1">Male</label>
                </div>
                
                <div class="custom-control custom-radio custom-control-inline ml-3">
                    <input type="radio" id="customRadioInline2" name="gender" class="custom-control-input" value="Female">
                    <label class="custom-control-label" for="customRadioInline2">Female</label>
                </div>
            </div>
        </div>

        <div class="form-group col-md-6">
            <label>Image</label>
            <input type="file" class="form-control" name="img" required> 
        </div>
    </div>

    <input type="submit" value="Submit" class="btn btn-primary my-2" style="width: 200px">

</form>

{% include 'footer.html' %}

{% if error == "no" %}
<script>
    alert("Signup Successful");
    window.location = '{% url "user_login" %}'
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something went wrong, Please Try Again");
</script>
{% endif %}

{% endblock %}
